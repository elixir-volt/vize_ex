[package]
name = "vize_ex_nif"
version = "0.1.0"
edition = "2021"

[lib]
name = "vize_ex_nif"
crate-type = ["cdylib"]

[dependencies]
rustler = { version = "0.38", default-features = false, features = ["derive", "nif_version_2_15"] }
rustler_match_spec = { version = "0.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lightningcss = { version = "=1.0.0-alpha.72", features = ["visitor"] }
grass = { version = "0.13.4", default-features = false }

# Keep every Vize crate on one published release so their internal APIs stay in sync.
vize_carton = "=0.362.0"
vize_relief = "=0.362.0"
vize_armature = "=0.362.0"
vize_atelier_core = "=0.362.0"
vize_atelier_dom = "=0.362.0"
vize_atelier_vapor = "=0.362.0"
vize_atelier_ssr = "=0.362.0"
vize_atelier_sfc = { version = "=0.362.0", features = ["native"] }
vize_patina = "=0.362.0"
vize_croquis = "=0.362.0"

[dev-dependencies]
proptest = "1.6"
