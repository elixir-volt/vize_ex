[package]
name = "vize_ex_nif"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[lib]
name = "vize_ex_nif"
crate-type = ["cdylib"]

[dependencies]
rustler = { version = "0.38", default-features = false, features = ["derive", "nif_version_2_15"] }
rustler_match_spec = { version = "0.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
html-escape = "0.2"
lightningcss = { version = "=1.0.0-alpha.72", features = ["visitor"] }
grass = { version = "0.13.4", default-features = false }

# Keep every Vize crate on one published release so their internal APIs stay in sync.
vize_carton = "=0.429.1"
vize_relief = "=0.429.1"
vize_armature = "=0.429.1"
vize_atelier_core = "=0.429.1"
vize_atelier_dom = "=0.429.1"
vize_atelier_vapor = "=0.429.1"
vize_atelier_ssr = "=0.429.1"
vize_atelier_sfc = { version = "=0.429.1", features = ["native"] }
vize_patina = "=0.429.1"
vize_croquis = "=0.429.1"
vize_davinci = "=0.429.1"
vize_l1 = "=0.429.1"
vize_l1_to_l2 = "=0.429.1"
vize_l2 = "=0.429.1"

[dev-dependencies]
proptest = "1.6"
